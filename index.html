<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prato de frutas — Ver na mesa</title>
<meta name="description" content="Veja o prato na sua mesa, em tamanho real, com a câmera do celular.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  :root {
    --papel: #f4ecdf;
    --tinta: #22190f;
    --tomate: #b8402a;
    --cinza: #5a4a3a;
    --serif: "Fraunces", Georgia, serif;
    --sans: "Hanken Grotesk", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--papel);
    color: var(--tinta);
    font: 400 17px/1.55 var(--sans);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 40px;
  }
  .conteudo { width: 100%; max-width: 420px; }
  h1 {
    font: 600 36px/1.05 var(--serif);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .descricao { margin: 0 0 20px; color: var(--cinza); }
  model-viewer {
    width: 100%;
    height: 300px;
    background: transparent;
    --poster-color: transparent;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-top: 1px solid var(--tinta);
    padding-top: 14px;
    margin-top: 8px;
  }
  .preco { font: 600 24px var(--serif); }
  .medida { color: var(--cinza); font-size: 15px; }

  .acao {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 22px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 999px;
    background: var(--tomate);
    color: #fff;
    font: 600 17px/1 var(--sans);
    text-decoration: none;
    border: 0;
    cursor: pointer;
  }
  .acao:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
  .acao img {
    width: 36px; height: 36px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .dica { margin: 14px 0 0; font-size: 14px; color: var(--cinza); text-align: center; }
  .oculto { display: none !important; }
</style>
</head>
<body>
<main class="conteudo">
  <h1>Prato de frutas</h1>
  <p class="descricao">Frutas frescas da estação, com banana, abacate e frutas vermelhas.</p>

  <model-viewer
    src="prato.glb"
    alt="Prato de frutas em tamanho real"
    camera-controls
    auto-rotate
    shadow-intensity="0.8"
    shadow-softness="0.6"
    touch-action="pan-y"></model-viewer>

  <div class="meta">
    <span class="preco">R$ 32,00</span>
    <span class="medida">Prato de 27 cm</span>
  </div>

  <!-- iPhone: AR Quick Look abre direto com o toque -->
  <a id="botao-ios" class="acao oculto" rel="ar" href="prato.usdz">
    <img src="prato.jpg" alt="">
    Ver na minha mesa
  </a>

  <!-- Android: Scene Viewer abre direto com a câmera -->
  <a id="botao-android" class="acao oculto" href="#">
    Ver na minha mesa
  </a>

  <!-- Computador: só a visualização 3D -->
  <p id="dica-desktop" class="dica oculto">Abra esta página no celular para ver o prato na sua mesa.</p>
</main>

<script>
  const ua = navigator.userAgent;
  const ehIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const ehAndroid = /Android/.test(ua);

  if (ehIOS) {
    document.getElementById('botao-ios').classList.remove('oculto');
  } else if (ehAndroid) {
    const glb = new URL('prato.glb', location.href).href;
    const pagina = location.href;
    const intent =
      'intent://arvr.google.com/scene-viewer/1.0' +
      '?file=' + encodeURIComponent(glb) +
      '&mode=ar_only&resizable=false' +
      '#Intent;scheme=https;package=com.google.android.googlequicksearchbox;' +
      'action=android.intent.action.VIEW;' +
      'S.browser_fallback_url=' + encodeURIComponent(pagina) + ';end;';
    const botao = document.getElementById('botao-android');
    botao.href = intent;
    botao.classList.remove('oculto');
  } else {
    document.getElementById('dica-desktop').classList.remove('oculto');
  }
</script>
</body>
</html>
